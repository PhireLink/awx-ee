---

name: CI

on:
  pull_request:
    branches: [devel, devel-phirelink]

  push:
    branches: [devel, devel-phirelink]

  schedule:
  # build on Sunday so if something breaks we can fix it Monday
  - cron: '0 0 * * 0'

jobs:
  podman:
    runs-on: ubuntu-24.04
    name: Podman
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Build EE with Podman
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          tox -e podman

  docker:
    runs-on: ubuntu-24.04
    name: Docker
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Build EE with Docker
        env:
          DOCKER_BUILDKIT: 1
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          tox -e docker
